<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
 
    // Construct the root URL. If your repository name is empty or you are using a custom domain, 
    // it defaults to the root domain.
    var redirectUrl = window.location.origin;
    
    // Perform the client-side redirect
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>Page not found. Redirecting you to the home page...</p>
</body>
</html>
